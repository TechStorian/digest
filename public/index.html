<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily Digest</title>
  <meta name="description" content="Today's tech and science stories from TLDR, Videnskab.dk, Version2 and The Conversation in one place." />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap"
  />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      const t = localStorage.getItem('nd:theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <header class="masthead">
    <div class="masthead__inner">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">D</span>
        <div>
          <h1 class="brand__title">Daily Digest</h1>
          <p class="brand__date" id="today"></p>
        </div>
      </div>

      <div class="masthead__actions">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          <input id="search" type="search" placeholder="Search stories" autocomplete="off" aria-label="Search stories" />
          <kbd aria-hidden="true">/</kbd>
        </label>
        <button class="icon-btn" id="refresh" type="button" title="Refresh news" aria-label="Refresh news">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7" /><path d="M20 4v7h-7" /></svg>
        </button>
        <button class="icon-btn" id="theme" type="button" title="Toggle theme" aria-label="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></svg>
        </button>
      </div>
    </div>

    <nav class="filters" aria-label="Filters">
      <div class="segmented" id="sources" role="tablist" aria-label="Source"></div>
      <div class="chips" id="categories" aria-label="Category"></div>
      <label class="toggle">
        <input type="checkbox" id="unread" />
        <span>Unread only</span>
      </label>
    </nav>
  </header>

  <main class="content">
    <div class="notice" id="notice" hidden></div>
    <div id="feed" aria-live="polite"></div>
  </main>

  <footer class="footer">
    <p><span id="credits"></span> <span id="updated"></span></p>
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
